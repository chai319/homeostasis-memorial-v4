<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B1020"><title>恒常性メモリアル V4</title><link rel="stylesheet" href="style-v4.css"><link rel="stylesheet" href="stage-v4.css?v=v45lake-final2"><link rel="stylesheet" href="full-v4.css?v=v45lake-final2"></head>
<body><main id="app">
<section id="title-screen" class="screen title-screen">
 <div class="title-art" aria-hidden="true"><img id="title-art" alt=""></div>
 <div class="title-copy"><p class="eyebrow">HOMEOSTASIS MEMORIAL · V4</p><h1>恒常性<br>メモリアル</h1><p class="tagline">観察するほど、近くなる。</p><span class="edition">V4.5 全編試遊版 · 湖上実習・固有イベント</span>
 <form id="start-form"><label>名字<input id="player-sei" value="春野" maxlength="12" autocomplete="off"></label><label>名前<input id="player-mei" value="悠" maxlength="12" autocomplete="off"></label>
 <label>あなたの性別<select id="player-gender"><option value="male">男性</option><option value="female">女性</option></select></label>
 <label>攻略相手のバージョン<select id="cast-gender"><option value="female">女性キャスト</option><option value="male">男性キャスト</option></select></label>
 <button type="submit" class="primary">はじめから</button></form>
 <button id="load-title">つづきから</button><p id="title-status" role="status"></p></div>
</section>
<section id="game-screen" class="screen" hidden>
 <div id="scene-background" class="scene-background"></div><div class="color-wash"></div>
 <header class="hud"><div class="date-tag"><strong id="date-text"></strong><span id="time-text"></span></div><span id="place-text"></span><div class="tools"><button id="map-button">マップ</button><button id="history-button">履歴</button><button id="notebook-button">手帳</button><button id="save-button">保存</button><button id="settings-button" aria-label="設定">設定</button></div><div id="status-strip" class="status-strip" role="group" aria-label="現在の能力とストレス"></div></header>
 <div id="cast-stage" class="portrait-area" aria-hidden="true"></div>
 <div id="status-toast" role="status"></div>
 <div id="growth-feedback" role="status" aria-live="polite" aria-atomic="true" hidden></div>
 <button id="dialogue" class="dialogue" aria-label="台詞を進める"><span id="speaker"></span><span id="dialogue-text"></span><span class="next-mark" aria-hidden="true">▼</span></button>
 <section id="choice-panel" class="choice-panel" aria-label="選択肢" hidden><h2 id="question"></h2><div id="choice-buttons"></div></section>
 <section id="activity-panel" hidden aria-label="試験・体育祭"></section>
 <section id="milestone" class="milestone" hidden><p id="completion-eyebrow" class="eyebrow"></p><h2 id="completion-title"></h2><p id="completion-text"></p><button id="milestone-notebook">生徒手帳を見る</button><button id="back-title">タイトルへ</button></section>
 <div id="transition" class="transition" hidden><span id="transition-title"></span></div>
</section>
</main>
<dialog id="modal"><div class="modal-heading"><h2 id="modal-title"></h2><button id="close-modal" aria-label="閉じる">閉じる</button></div><div id="modal-content"></div></dialog>
<script src="source-version.js?v=v45lake-final2"></script><script src="game-v4.js?v=v45lake-final2"></script><script src="backgrounds.js?v=night-20261017"></script><script src="characters.js"></script><script src="stage-metrics.js"></script><script src="asset-manifest.js?v=v45lake-final2"></script><script src="rng-v4.js"></script><script src="localization-v4.js?v=v45lake-final2"></script><script src="performance-assets-v45.js?v=20261018"></script><script src="performance-cues-v45.js?v=20261018"></script><script src="presentation-v45.js?v=performance-20261018"></script><script src="core-v45.js?v=v45lake-final2"></script><script src="playtest-content-v4.js?v=v45lake-final2"></script><script src="playtest-revision-v4.js?v=v45lake-final2"></script><script src="v45-runtime-policy.js?v=bgm-context-20261017"></script><script src="v45-display-patches.js"></script><script src="playtest-revision-v45.js?v=solo-walk-20261018"></script><script src="lake-sprites-v45.js"></script><script src="audio-v4.js?v=v45lake-final2"></script><script src="growth-feedback-v4.js?v=growth-floor-20261017"></script><script src="game-widgets-v4.js?v=v45lake-final2"></script><script src="date-invitation-v45.js?v=20261017"></script><script src="choice-presentation-v45.js?v=20261017"></script><script src="app-v45.js?v=performance-20261018"></script>
</body></html>
